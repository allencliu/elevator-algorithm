<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>elevator algorithm</title>
    <link rel="stylesheet" href="style.css">
    <script src="elevator.js" defer></script>
</head>
<body>
    <header>
        <div class="title">
            <h1>elevator algorithm</h1>
            <p class="sub">look/scan · 10 floors · 3 cars</p>
        </div>
        <p class="hint" id="hint">click a floor to set an origin</p>
    </header>

    <div class="controls">
        <ul class="legend">
            <li class="idle">idle</li>
            <li class="moving">moving</li>
            <li class="boarding">doors open</li>
        </ul>
        <button id="reset" type="button">reset</button>
    </div>

    <main id="building"></main>
</body>
</html>
